# Common environment variables
x-common-env: &common-env
  # Redis URLs
  REDIS_BROKER_URL: redis://redis:6379/0
  REDIS_RESULT_URL: redis://redis:6379/1
  REDIS_PUBSUB_URL: redis://redis:6379/2
  
  # MongoDB Configuration (local container, no external Atlas/DNS dependency)
  MONGODB_URL: mongodb://mongo:27017/stockanalysis
  
  # Application Configuration
  SYMBOLS: ADAUSD
  STRATEGIES: "*"
  SCHEDULE_SECONDS: 600
  TZ: Asia/Kolkata
  
  # Redis Pub/Sub Channels
  PUBSUB_CHANNEL_BATCH: stockanalysis:batch_complete
  
  # Celery Configuration
  TIMEZONE: Asia/Kolkata
  ENABLE_UTC: false
  TASK_IGNORE_RESULT: true
  RESULT_EXPIRES: 900
  WORKER_PREFETCH_MULTIPLIER: 1
  TASK_ACKS_LATE: true
  BROKER_CONNECTION_RETRY_ON_STARTUP: true
  
  PYTHONPATH: /app

services:
  # Redis for Celery broker, result backend, and pub/sub
  redis:
    image: redis:7-alpine
    container_name: stockanalysis-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--databases", "16"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for persisting strategy/batch results
  mongo:
    image: mongo:7
    container_name: stockanalysis-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Flower for Celery monitoring
  flower:
    image: mher/flower:latest
    container_name: stockanalysis-flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery worker for task execution
  worker:
    build: .
    container_name: stockanalysis-worker
    command: uv run celery -A app.core.celery_app.celery_app worker --loglevel=INFO --pool=prefork --concurrency=9
    environment:
      <<: *common-env
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Celery beat for periodic task scheduling
  beat:
    build: .
    container_name: stockanalysis-beat
    command: uv run celery -A app.core.celery_app.celery_app beat --loglevel=INFO
    environment:
      <<: *common-env
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Web Dashboard Service (FastAPI)
  dashboard:
    build: .
    container_name: stockanalysis-dashboard
    command: uv run uvicorn app.dashboard.main:app --host 0.0.0.0 --port 8080
    environment:
      <<: *common-env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local

