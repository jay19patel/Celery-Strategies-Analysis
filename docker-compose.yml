# TradeBuddy Pro Full-Stack Architecture
#
# Services:
#   - redis: Redis 7 in-memory cache & PubSub broker
#   - backend: FastAPI REST API & WebSocket server (port 8000)
#   - celery-worker: Asynchronous strategy worker queue
#   - frontend: Next.js modern trading terminal (port 3000)
#
# Quick Start:
#   docker compose up --build

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /app/data/tradebuddy.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      AUTH_PIN: "242425"
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.infrastructure.celery.worker.celery_app", "worker", "--loglevel=info", "-Q", "strategies", "--concurrency=2"]
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/tradebuddy.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend
