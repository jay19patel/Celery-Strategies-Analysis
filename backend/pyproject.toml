[project]
name = "tradebuddy-backend"
version = "5.0.0"
description = "TradeBuddy options desk — FastAPI engine for automated and manual options structures on Delta Exchange India"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.1",
    "argon2-cffi>=25.1.0",
    "apscheduler>=3.11,<4",
    "litellm>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S", "DTZ"]
ignore = ["E501", "B008", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012"]
