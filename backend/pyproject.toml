[project]
name = "tradebuddy-backend"
version = "4.0.0"
description = "TradeBuddy v4 — FastAPI backend with SQLModel, WebSocket & Redis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.6.3",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.1",
    "argon2-cffi>=25.1.0",
    "pyzmq>=27.2.0",
    "websockets>=14.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S", "DTZ"]
ignore = ["E501", "B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012"]
