<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Login · TradeBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
            mono: ['"JetBrains Mono"', "ui-monospace", "monospace"],
          },
          colors: {
            brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#1e88e5", 600: "#1565c0", 700: "#0d47a1" },
            bull: { DEFAULT: "#00b852", bg: "#e6f4ea", text: "#0e8a16" },
            bear: { DEFAULT: "#eb5757", bg: "#fce8e6", text: "#cf1322" },
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    .pin-box {
      transition: all 0.15s ease;
    }
    .pin-box:focus {
      border-color: #1e88e5;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <!-- White Login Card matching TradeBuddy Theme -->
  <div class="w-full max-w-sm sm:max-w-md bg-white border border-slate-200/90 rounded-2xl p-6 sm:p-8 shadow-xl shadow-slate-200/60 flex flex-col items-center">
    
    <!-- TradeBuddy Logo Icon -->
    <div class="w-12 h-12 rounded-xl bg-brand-500 text-white grid place-items-center shadow-md shadow-brand-500/20 mb-3.5">
      <i data-lucide="candlestick-chart" class="w-6 h-6"></i>
    </div>
    
    <div class="text-xl font-bold tracking-tight text-slate-900">TradeBuddy</div>
    
    <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 mt-1 text-[11px] font-semibold uppercase tracking-wider text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Terminal Security
    </div>
    
    <p class="text-xs sm:text-sm text-slate-500 text-center mt-2 mb-6">Enter your 6-digit PIN to trade and change settings</p>

    <!-- Error/Notice Alert -->
    <div id="alertBox" class="hidden w-full mb-5 p-3 rounded-xl text-xs flex items-center gap-2.5 transition-all">
      <i id="alertIcon" data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span id="alertMsg" class="font-medium"></span>
    </div>

    <!-- PIN Input Form -->
    <form id="pinForm" onsubmit="event.preventDefault(); submitPin();" class="w-full flex flex-col items-center">
      
      <!-- 6 Digit Boxes -->
      <div id="pinBoxContainer" class="flex items-center justify-center gap-2 sm:gap-3 mb-5">
        <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" id="digit0" class="pin-box w-11 h-14 sm:w-13 sm:h-16 text-center text-xl sm:text-2xl font-mono font-bold bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-900 outline-none" autofocus autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" id="digit1" class="pin-box w-11 h-14 sm:w-13 sm:h-16 text-center text-xl sm:text-2xl font-mono font-bold bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-900 outline-none" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" id="digit2" class="pin-box w-11 h-14 sm:w-13 sm:h-16 text-center text-xl sm:text-2xl font-mono font-bold bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-900 outline-none" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" id="digit3" class="pin-box w-11 h-14 sm:w-13 sm:h-16 text-center text-xl sm:text-2xl font-mono font-bold bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-900 outline-none" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" id="digit4" class="pin-box w-11 h-14 sm:w-13 sm:h-16 text-center text-xl sm:text-2xl font-mono font-bold bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-900 outline-none" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" id="digit5" class="pin-box w-11 h-14 sm:w-13 sm:h-16 text-center text-xl sm:text-2xl font-mono font-bold bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-900 outline-none" autocomplete="off">
      </div>

      <!-- Visibility Toggle & 7-day Session Info -->
      <div class="flex items-center justify-between w-full px-1 mb-6 text-xs text-slate-500">
        <button type="button" id="toggleMaskBtn" onclick="toggleMask()" class="flex items-center gap-1.5 hover:text-slate-800 transition-colors">
          <i id="maskIcon" data-lucide="eye" class="w-3.5 h-3.5"></i>
          <span id="maskLabel">Show PIN</span>
        </button>
        <div class="flex items-center gap-1 text-slate-500">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-brand-500"></i>
          <span>7-day persistent session</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full h-11 sm:h-12 rounded-xl bg-brand-500 hover:bg-brand-600 active:scale-[0.99] text-white font-medium text-sm shadow-sm shadow-brand-500/25 flex items-center justify-center gap-2 transition-all">
        <span id="btnText">Unlock Terminal</span>
        <i id="btnIcon" data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>
    <a href="/" class="mt-3 text-xs text-slate-500 hover:text-slate-800 flex items-center gap-1.5"><i data-lucide="eye" class="w-3.5 h-3.5"></i>Just watching? View the dashboard read-only</a>

    <!-- Footer Note -->
    <div class="mt-6 pt-5 border-t border-slate-100 w-full text-center text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
      <i data-lucide="lock" class="w-3 h-3 text-slate-400"></i>
      <span>Secured by Argon2id & Encrypted Sessions</span>
    </div>
  </div>

  <script>
    const digits = [
      document.getElementById('digit0'),
      document.getElementById('digit1'),
      document.getElementById('digit2'),
      document.getElementById('digit3'),
      document.getElementById('digit4'),
      document.getElementById('digit5'),
    ];
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const pinBoxContainer = document.getElementById('pinBoxContainer');
    let isMasked = true;
    let isSubmitting = false;

    // Focus first input on load
    window.addEventListener('DOMContentLoaded', () => {
      digits[0].focus();
      lucide.createIcons();
    });

    // Handle typing on physical keyboard
    digits.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val[val.length - 1] : '';
        if (e.target.value && index < 5) {
          digits[index + 1].focus();
        }
        checkAutoSubmit();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (!input.value && index > 0) {
            digits[index - 1].focus();
            digits[index - 1].value = '';
          }
        } else if (e.key === 'ArrowLeft' && index > 0) {
          digits[index - 1].focus();
        } else if (e.key === 'ArrowRight' && index < 5) {
          digits[index + 1].focus();
        }
      });

      // Handle paste event (e.g. pasting "242425")
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/[^0-9]/g, '');
        if (pasted.length >= 6) {
          for (let i = 0; i < 6; i++) {
            digits[i].value = pasted[i];
          }
          digits[5].focus();
          submitPin();
        }
      });
    });

    function clearPin() {
      if (isSubmitting) return;
      digits.forEach(d => d.value = '');
      digits[0].focus();
      hideAlert();
    }

    function getPin() {
      return digits.map(d => d.value).join('');
    }

    function checkAutoSubmit() {
      if (getPin().length === 6) {
        submitPin();
      }
    }

    function toggleMask() {
      isMasked = !isMasked;
      digits.forEach(d => d.type = isMasked ? 'password' : 'text');
      document.getElementById('maskLabel').textContent = isMasked ? 'Show PIN' : 'Hide PIN';
      document.getElementById('maskIcon').setAttribute('data-lucide', isMasked ? 'eye' : 'eye-off');
      lucide.createIcons();
    }

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-rose-50', 'border-rose-200', 'text-rose-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      if (isError) {
        alertBox.classList.add('bg-rose-50', 'border', 'border-rose-200', 'text-rose-700');
        alertIcon.setAttribute('data-lucide', 'alert-circle');
      } else {
        alertBox.classList.add('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-700');
        alertIcon.setAttribute('data-lucide', 'check-circle-2');
      }
      alertMsg.textContent = msg;
      lucide.createIcons();
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
    }

    async function submitPin() {
      const pin = getPin();
      if (pin.length !== 6) {
        showAlert('Please enter all 6 digits');
        return;
      }
      if (isSubmitting) return;

      isSubmitting = true;
      btnText.textContent = 'Verifying...';
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');

      const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin, next: nextUrl })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          showAlert('PIN verified! Opening TradeBuddy...', false);
          btnText.textContent = 'Unlocked!';
          btnIcon.setAttribute('data-lucide', 'check');
          lucide.createIcons();
          setTimeout(() => {
            window.location.href = data.redirect || nextUrl;
          }, 350);
        } else {
          // Trigger shake animation
          pinBoxContainer.classList.add('shake');
          setTimeout(() => pinBoxContainer.classList.remove('shake'), 450);

          const errorDetail = data.detail || 'Incorrect PIN. Try again.';
          showAlert(errorDetail, true);
          clearPin();
        }
      } catch (err) {
        showAlert('Connection error. Please try again.', true);
        clearPin();
      } finally {
        isSubmitting = false;
        btnText.textContent = 'Unlock Terminal';
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
      }
    }
  </script>
</body>
</html>
