# TradeBuddy v4 Architecture Compose (Separated Next.js Frontend + FastAPI Backend)
#
# Frontend: http://localhost:3000
# Backend API & Docs: http://localhost:8000/docs
# WebSocket Stream: ws://localhost:8000/ws
#
# Run:
#   docker compose -f docker-compose.v4.yml up --build

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /app/data/tradebuddy.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      AUTH_PIN: "242425"
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend
